<!DOCTYPE html>
<html>
  <head><title>Netlify Forms Detection</title></head>
  <body>
    <!-- This file exists solely for Netlify to detect the form at build time -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="fullName" />
      <input name="company" />
      <input name="email" />
      <input name="website" />
      <input name="country" />
      <input name="industry" />
      <input name="lookingFor" />
      <input name="timeline" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
